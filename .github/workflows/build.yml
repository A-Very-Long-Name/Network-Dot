name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test connectivity state
        run: ./scripts/test.sh
      - name: Build universal macOS app
        run: ./scripts/build.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Network-Dot-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
